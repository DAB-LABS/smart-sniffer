# Build and publish SMART Sniffer Agent binaries on tagged releases.
#
# Trigger: push a tag like v0.1.0
# git tag v0.1.0
# git push origin v0.1.0
#
# The workflow:
# 1. Checks out the code
# 2. Cross-compiles for all supported platforms
# 3. Generates SHA256 checksums
# 4. Creates a GitHub Release with all artifacts attached

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # PINNED, not ubuntu-latest. GitHub migrates ubuntu-latest to Ubuntu 26.04
    # between 2026-10-19 and 2026-11-19, and a release should not change what
    # it was built on because of a date someone else picked. tests.yml stays on
    # ubuntu-latest and is the canary for that migration; if it goes green on
    # Ubuntu 26, bump this deliberately.
    #
    # This label will eventually be retired, which fails hard rather than
    # warning. Review by 2027-04.
    # https://github.com/actions/runner-images/issues/14748
    runs-on: ubuntu-24.04

    steps:
      # ACTIONS ARE PINNED TO COMMIT SHAs, not tags. A tag can be moved; this
      # workflow holds a write token and publishes the binaries that install.sh
      # fetches, so the supply chain into it is worth fixing in place. The
      # version comment is the human readable part; bump both together.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Vet Go
        working-directory: agent
        run: go vet ./...

      # Ruff is pinned to an exact version on purpose. Its default rule set
      # changes between releases, so an unpinned install lets an upstream
      # release fail a tagged build on source that did not change. Bump this
      # deliberately, and run the same version locally before tagging.
      #
      # The lint paths must match tests.yml. When they drifted, a finding in
      # tests/ failed every push while the tagged build passed, so the two
      # workflows disagreed about what "clean" means and the release gate was
      # the weaker of the two.
      - name: Lint Python
        env:
          RUFF_VERSION: "0.15.20"
        run: |
          pip install "ruff==${RUFF_VERSION}"
          ruff --version
          ruff check custom_components/ tests/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build all platforms
        working-directory: agent
        run: make all VERSION=${{ steps.version.outputs.VERSION }}

      - name: Generate checksums
        working-directory: agent/build
        run: |
          sha256sum smartha-agent-* > checksums.txt
          cat checksums.txt

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the section for the current version from CHANGELOG.md.
          # Grabs everything between the first "## v*" heading and the next one.
          NOTES=$(awk '
            /^## v/ { if (found) exit; found=1; next }
            found { print }
          ' CHANGELOG.md)
          # Write to a step output using a heredoc delimiter to preserve newlines.
          {
            echo "NOTES<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # v3.0.0 was purely the Node 20 to Node 24 runtime move; inputs are
        # unchanged from v2.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: SMART Sniffer v${{ steps.version.outputs.VERSION }}
          # Auto-flag any tag with -rc, -beta, or -alpha as a pre-release
          # so GitHub's "latest release" endpoint skips it. install.sh and
          # install.ps1 both call that endpoint for version discovery; if
          # an rc were marked latest, every user running the install one-
          # liner without pinning VERSION would be pulled onto an rc.
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          body: |
            ${{ steps.changelog.outputs.NOTES }}

            📋 [Full Changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

            ---

            ### ⚡ Update Your Agents
            **Already have agents running?** Update them to match this release:
            ```bash
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash
            ```
            The installer detects your existing configuration and offers to keep it — just press Enter to upgrade in place.

            ---

            ### Fresh Install

            **Linux / macOS (one command):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash
            ```

            **Windows (PowerShell as Admin):**
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```

            ### Manual Download
            Download the binary for your platform below, then see the [README](https://github.com/${{ github.repository }}#installation) for manual installation instructions.

            ### Checksums
            Verify your download with `sha256sum -c checksums.txt`.
          files: |
            agent/build/smartha-agent-linux-amd64
            agent/build/smartha-agent-linux-arm64
            agent/build/smartha-agent-linux-arm
            agent/build/smartha-agent-darwin-amd64
            agent/build/smartha-agent-darwin-arm64
            agent/build/smartha-agent-windows-amd64.exe
            agent/build/checksums.txt
          generate_release_notes: true
