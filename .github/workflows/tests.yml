# Lint and test on every push and pull request.
#
# release.yml triggers only on v* tags, so until this workflow existed nothing
# ran on a pull request: contributor PRs received no automated checking, and
# lint failures surfaced on release night rather than months earlier.
#
# This workflow does not build or publish anything. Releases stay in
# release.yml.
#
# RUNNER: deliberately ubuntu-latest, while release.yml is pinned to
# ubuntu-24.04. GitHub migrates ubuntu-latest to Ubuntu 26.04 between
# 2026-10-19 and 2026-11-19. This workflow is the canary: it runs on every
# push, so a breakage surfaces here at no cost instead of on release night.
# The deprecation warning this produces is expected. Do not silence it by
# pinning without also deciding what replaces the early warning.
# https://github.com/actions/runner-images/issues/14748
#
# ACTIONS ARE PINNED TO COMMIT SHAs, not tags. A tag is mutable and these
# actions run with a token in a repo that publishes binaries people install
# with curl | sudo bash. The version comment after each SHA is the human
# readable part; when bumping, change both.

name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tier 1 tests are stdlib only, so this version is not load bearing yet.
      # Tier 2 adds pytest-homeassistant-custom-component, which tracks Home
      # Assistant releases; align this with whatever that pin targets.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # DUPLICATED PIN. release.yml carries its own copy of RUFF_VERSION and
      # the two must be bumped together. Sharing it through a requirements
      # file was considered and rejected: release.yml is tag-triggered, so a
      # mistake in it is not caught until release night, and it has carried
      # three releases unchanged. If these two ever disagree, release.yml is
      # the one that gates a release and therefore the one that is correct.
      - name: Lint Python
        env:
          RUFF_VERSION: "0.15.20"
        run: |
          pip install "ruff==${RUFF_VERSION}"
          ruff --version
          ruff check custom_components/ tests/

      - name: Test Python
        run: |
          pip install -r requirements_test.txt
          pytest tests/ -q

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Vet Go
        working-directory: agent
        run: go vet ./...

      - name: Test Go
        working-directory: agent
        run: go test ./...
