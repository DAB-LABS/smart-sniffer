# Lint and test on every push and pull request.
#
# release.yml triggers only on v* tags, so until this workflow existed nothing
# ran on a pull request: contributor PRs received no automated checking, and
# lint failures surfaced on release night rather than months earlier.
#
# This workflow does not build or publish anything. Releases stay in
# release.yml.
#
# RUNNER: deliberately ubuntu-latest, while release.yml is pinned to
# ubuntu-24.04. GitHub migrates ubuntu-latest to Ubuntu 26.04 between
# 2026-10-19 and 2026-11-19. This workflow is the canary: it runs on every
# push, so a breakage surfaces here at no cost instead of on release night.
# The deprecation warning this produces is expected. Do not silence it by
# pinning without also deciding what replaces the early warning.
# https://github.com/actions/runner-images/issues/14748
#
# ACTIONS ARE PINNED TO COMMIT SHAs, not tags. A tag is mutable and these
# actions run with a token in a repo that publishes binaries people install
# with curl | sudo bash. The version comment after each SHA is the human
# readable part; when bumping, change both.

name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tier 1 tests are stdlib only, so this version is not load bearing yet.
      # Tier 2 adds pytest-homeassistant-custom-component, which tracks Home
      # Assistant releases; align this with whatever that pin targets.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # DUPLICATED PIN. release.yml carries its own copy of RUFF_VERSION and
      # the two must be bumped together. Sharing it through a requirements
      # file was considered and rejected: release.yml is tag-triggered, so a
      # mistake in it is not caught until release night, and it has carried
      # three releases unchanged. If these two ever disagree, release.yml is
      # the one that gates a release and therefore the one that is correct.
      - name: Lint Python
        env:
          RUFF_VERSION: "0.15.20"
        run: |
          pip install "ruff==${RUFF_VERSION}"
          ruff --version
          ruff check custom_components/ tests/

      - name: Test Python
        run: |
          pip install -r requirements_test.txt
          pytest tests/ -q

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Vet Go
        working-directory: agent
        run: go vet ./...

      - name: Test Go
        working-directory: agent
        run: go test ./...

  # The declared Home Assistant floor, actually installed and imported.
  #
  # hacs.json says which Home Assistant release this integration supports at
  # minimum. Nothing tested that: v0.3.0 through v0.6.2 declared 2024.1.0 while
  # config_flow.py imported ConfigFlowResult, which only exists from 2024.4, so
  # on every release in the declared range the integration could not be added
  # and its options could not be opened. That shipped for six months.
  #
  # This job installs exactly what hacs.json declares and imports every module.
  # The version is read from the file, never written here, so raising or
  # lowering the floor moves the test with it.
  floor:
    name: Declared Home Assistant floor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Python version follows the floor rather than being pinned here: the
      # requires_python of that exact homeassistant release is what its own
      # metadata says, so a floor bump cannot leave this behind. 2024.4 wants
      # 3.12; later floors will want 3.13 and then 3.14.
      - name: Resolve the floor and its Python version
        id: floor
        run: |
          set -euo pipefail
          floor=$(jq -re '.homeassistant' hacs.json)
          requires=$(curl -fsSL "https://pypi.org/pypi/homeassistant/${floor}/json" \
            | jq -re '.info.requires_python')
          python_version=$(printf '%s' "$requires" | grep -oE '3\.[0-9]+' | head -1)
          if [ -z "$python_version" ]; then
            echo "Could not read a Python version out of requires_python: $requires" >&2
            exit 1
          fi
          echo "Floor $floor requires Python $requires, using $python_version"
          echo "floor=$floor" >> "$GITHUB_OUTPUT"
          echo "python_version=$python_version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.floor.outputs.python_version }}
          cache: pip
          # hacs.json is the only input to what this job installs, so it is the
          # right cache key. A floor bump invalidates the cache, as it should.
          cache-dependency-path: hacs.json

      - name: Install Home Assistant at the floor
        run: |
          set -euo pipefail
          # josepy 2.0 removed ComparableX509, which acme still calls, and Home
          # Assistant's constraints do not pin josepy. Installing an older floor
          # today therefore resolves a broken pair and every import fails on
          # upstream packaging rather than on anything in this repo. Users are
          # unaffected: their Home Assistant ships a resolved environment. Drop
          # this pin once the floor reaches a release whose tree has no conflict.
          pip install "homeassistant==${{ steps.floor.outputs.floor }}" "josepy<2"

      # Discovered, not listed: the manifest's own requirements, plus those of
      # each integration it declares a dependency on, read out of the installed
      # Home Assistant. config_flow.py falls back to
      # homeassistant.components.zeroconf on older releases, which needs the
      # zeroconf package that the zeroconf integration declares.
      - name: Install what the manifest asks for
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/requirements.txt
          import json, pathlib
          import homeassistant

          manifest = json.loads(
              pathlib.Path("custom_components/smart_sniffer/manifest.json").read_text()
          )
          root = pathlib.Path(homeassistant.__file__).parent
          requirements = list(manifest.get("requirements") or [])
          for dependency in manifest.get("dependencies") or []:
              path = root / "components" / dependency / "manifest.json"
              if path.is_file():
                  requirements += json.loads(path.read_text()).get("requirements") or []
          print("\n".join(requirements))
          PY
          cat /tmp/requirements.txt
          if [ -s /tmp/requirements.txt ]; then pip install -r /tmp/requirements.txt; fi

      # Every module under the integration, found by walking the directory. A
      # new module is covered without anyone editing this workflow.
      - name: Import every module
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib, pathlib, sys, traceback

          sys.path.insert(0, ".")
          failed = []
          for path in sorted(pathlib.Path("custom_components/smart_sniffer").rglob("*.py")):
              module = ".".join(path.with_suffix("").parts)
              module = module.removesuffix(".__init__")
              try:
                  importlib.import_module(module)
              except Exception:
                  failed.append(module)
                  print(f"FAIL {module}")
                  traceback.print_exc()
              else:
                  print(f"ok   {module}")

          if not failed:
              print("\nEvery module imports on the declared floor.")
              raise SystemExit(0)

          print(f"\n{len(failed)} module(s) do not import on the floor hacs.json declares:")
          for module in failed:
              print(f"  {module}")
          print("Either the floor in hacs.json is wrong, or the code uses something newer.")
          raise SystemExit(1)
          PY
